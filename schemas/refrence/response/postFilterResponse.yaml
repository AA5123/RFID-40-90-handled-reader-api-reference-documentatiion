title: postFilterPayload
x-stoplight:
  id: y5oysu0o0kuvb
type: object
description: Object schema for postFilterPayload.
properties:
  postFilter:
    type: array
    description: List of active post-filter rules currently applied by the reader.
    items:
      type: object
      description: One active post-filter rule.
      properties:
        dataEpType:
          type: string
          description: Data endpoint to which this filter rule applies.
        matchPattern:
          type: string
          description: Pattern used to evaluate tag data for this rule.
        matchPatternMethod:
          type: string
          description: Matching method used with the pattern, for example prefix or regex matching.
        reportOperation:
          type: string
          description: Defines whether matching tags are included or excluded from reported data.
        reportDuration:
          type: integer
          description: Optional duration in seconds for which this reporting behavior remains active.
