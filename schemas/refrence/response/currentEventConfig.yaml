title: currentEventConfig
x-stoplight:
  id: ybdvjj3a86pb4
type: object
description: Current event configuration state returned by the device.
properties:
  antenna:
    type: boolean
    description: True when antenna events are enabled.
  connection:
    type: boolean
    description: True when connection events are enabled.
  firmwareUpdate:
    type: boolean
    description: True when firmware update events are enabled.
  gpi:
    type: boolean
    description: True when GPI events are enabled.
  network:
    type: boolean
    description: True when network events are enabled.
  exceptions:
    type: boolean
    description: True when exception events are enabled.
  alert:
    type: boolean
    description: True when alert events are enabled.
  heartbeat:
    type: boolean
    description: True when heartbeat events are enabled.
  power:
    type: boolean
    description: True when power-related events are enabled.
  heartConfiguration:
    type: object
    description: Heartbeat payload configuration.
    properties:
      interval:
        type: number
        example: 100
        description: Heartbeat interval in seconds.
      inventoryStatus:
        type: boolean
        description: True when inventory status is included in heartbeat messages.
      scanStatus:
        type: boolean
        description: True when scan status is included in heartbeat messages.
      batteryStatus:
        type: boolean
        description: True when battery status is included in heartbeat messages.
      userApps:
        type: boolean
        description: True when user app status is included in heartbeat messages.
    required:
      - interval
      - inventoryStatus
      - scanStatus
      - batteryStatus
      - userApps
  exceptionConfiguration:
    type: object
    description: Exception event category toggles.
    properties:
      radio:
        type: boolean
        description: True when radio exception events are enabled.
      system:
        type: boolean
        description: True when system exception events are enabled.
      scanner:
        type: boolean
        description: True when scanner exception events are enabled.
    required:
      - radio
      - system
      - scanner
required:
  - antenna
  - connection
  - firmwareUpdate
  - gpi
  - network
  - exceptions
  - alert
  - heartbeat
  - power
