title: ethResponse
x-stoplight:
  id: m3kxui97rkljt
type: array
description: Ethernet interface response payload returned as a list of interface entries.
examples: []
items:
  type: object
  description: Single Ethernet interface entry.
  properties:
    InterfaceDetails:
      type: object
      description: Ethernet interface details including link, IP, and optional security settings.
      properties:
        interfaceName:
          type: string
          example: eth0
          description: Name of the Ethernet interface.
        status:
          type: string
          example: enabled
          enum:
            - enabled
            - disabled
          description: Administrative status of the Ethernet interface.
        hostName:
          type: string
          example: RFD40AB03
          description: Hostname assigned to the device.
        macAddress:
          type: string
          example: E0-D0-45-3D-38-1D
          description: MAC address of the Ethernet interface.
        linkStatus:
          type: object
          description: Physical link status and speed information.
          properties:
            status:
              type: string
              enum:
                - Connected
                - Disconnected
              example: Connected
              description: Current Ethernet link connectivity state.
            linkSpeed:
              type: string
              example: 100Mbps
              description: Negotiated Ethernet link speed.
        ipv4Configuration:
          type: object
          description: IPv4 addressing and DNS configuration for the interface.
          properties:
            ipAddress:
              type: string
              example: 192.168.1.81
              format: ipv4
              description: Assigned IPv4 address.
            subnetMask:
              type: string
              example: 255.255.255.0
              format: ipv4
              description: Subnet mask for the assigned IPv4 address.
            gateway:
              type: string
              example: 192.168.1.144
              format: ipv4
              description: Default gateway used by the interface.
            dhcpStatus:
              type: string
              enum:
                - enabled
                - disabled
              example: enabled
              description: Indicates whether DHCP is enabled for IPv4 settings.
            dnsServer:
              type: string
              format: ipv4
              example: 192.168.1.78
              description: DNS server used for name resolution.
            domainName:
              type: string
              example: test.soti.com
              description: Search domain associated with the interface.
        security:
          type: object
          description: Ethernet security settings, including 802.1X authentication when configured.
          properties:
            securityStatus:
              type: boolean
              example: true
              description: Indicates whether Ethernet security is enabled.
            EAP802_1X:
              type: object
              description: 802.1X authentication configuration.
              properties:
                authentication:
                  type: string
                  example: tls
                  enum:
                    - LEAP
                    - PEAP
                    - EAP-SIM
                    - EAP-AKA
                    - EAP-TLS
                    - EAP-TTLS
                    - EAP-FAST
                  description: Outer 802.1X authentication method.
                innerAuthentication:
                  type: string
                  example: none
                  description: Inner authentication method when applicable.
                certificate:
                  type: string
                  example: client45
                  description: Certificate identifier used for authentication.
