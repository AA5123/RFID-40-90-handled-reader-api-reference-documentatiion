title: ctrlOprPayload
x-stoplight:
  id: p5pvffwkuqqm1
type: object
description: Object schema for ctrlOprPayload.
properties:
  controlType:
    type: string
    description: Selects which reader subsystem to control.
    enum:
      - RFID
      - SCANNER
    example: RFID
  operation:
    type: string
    description: Action to execute for the selected control type. Use START to begin the operation and STOP to end it.
    enum:
      - START
      - STOP
required:
  - controlType
  - operation
