title: eventConfiguration
x-stoplight:
  id: jcezrdndi0i9w
type: object
description: Event and threshold configuration payload used to control which notifications are generated by the device.
properties:
  antenna:
    type: boolean
    description: Set to true to enable antenna-related events.
  terminalConnection:
    type: boolean
    description: Set to true to enable terminal connection and disconnection events.
  firmwareUpdate:
    type: boolean
    description: Set to true to enable firmware update events.
  gpi:
    type: boolean
    description: Set to true to enable GPI events.
  network:
    type: boolean
    description: Set to true to enable network events.
  exceptions:
    type: boolean
    description: Set to true to enable exception events.
  ntp:
    type: boolean
    description: Set to true to enable NTP-related events.
  userApp:
    type: boolean
    description: Set to true to enable user application events.
  heartbeat:
    type: boolean
    description: Set to true to enable heartbeat events.
  power:
    type: boolean
    description: Set to true to enable power source events.
  battery:
    type: boolean
    description: Set to true to enable battery events.
  temperature:
    type: boolean
    description: Set to true to enable temperature events.
  fileDownload:
    type: boolean
    description: Set to true to enable file download events.
  cpuUsage:
    type: boolean
    description: Set to true to enable CPU usage alerts.
  flashUsage:
    type: boolean
    description: Set to true to enable flash usage alerts.
  ramUsage:
    type: boolean
    description: Set to true to enable RAM usage alerts.
  heartbeatConfiguration:
    type: object
    description: Heartbeat payload options and interval settings.
    properties:
      interval:
        type: integer
        example: 100
        description: Heartbeat interval in seconds.
      inventoryStatus:
        type: boolean
        description: Set to true to include inventory status in heartbeat messages.
      batteryStatus:
        type: boolean
        description: Set to true to include battery status in heartbeat messages.
      userApps:
        type: boolean
        description: Set to true to include user app status in heartbeat messages.
  cpuThreshold:
    type: integer
    description: CPU usage percentage above which a CPU alert is triggered.
  ramThreshold:
    type: integer
    description: RAM usage percentage above which a RAM alert is triggered.
  flashThreshold:
    type: integer
    description: Flash usage percentage above which a flash alert is triggered.
  temperatureThreshold:
    type: integer
    description: Temperature value above which a temperature alert is triggered.
