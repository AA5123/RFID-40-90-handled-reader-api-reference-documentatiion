title: antennaEvent
x-stoplight:
  id: aqw5xmnoocpk6
type: array
description: Array of antenna connection events providing status and port information for each antenna on the device.
examples: []
items:
  type: object
  description: An antenna connection event containing status and port details.
  properties:
    antenna:
      type: object
      description: Antenna connection status and port information.
      properties:
        status:
          type: string
          enum:
            - connected
            - disconnected
          example: connected
          description: Indicates whether the antenna is connected or disconnected.
        port:
          type: number
          example: 3
          description: Specifies the port number where the antenna is connected.