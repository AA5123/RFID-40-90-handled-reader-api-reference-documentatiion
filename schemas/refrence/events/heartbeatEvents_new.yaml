anyOf:
  - properties:
      inventoryStatus:
        type: object
        description: Current status of the inventory scanning operation including tag count and scan progress.
        properties:
          status:
            type: string
            enum:
              - INPROGRESS
              - WAITING
              - STOPPED
            example: INPROGRESS
          tagsRed:
            type: integer
      scanStatus:
        type: object
        description: Status information about the scanning process including scan count.
        properties:
          status:
            type: string
            enum:
              - INPROGRESS
              - STOPPED
            example: INPROGRESS
          scanCount:
            type: integer
            example: 120
      batteryStatus:
        type: object
        description: Battery health and charge level information.
        properties:
          health:
            type: string
            example: good
          level:
            type: integer
            default: 92
          chargeStatus:
            type: integer
      userApps:
        type: array
        description: Array of active user applications with resource usage information.
        items:
          type: object
          description: Information about a user application including name, status, and resource usage.
          properties:
            appName:
              type: string
            status:
              type: string
            cpu:
              type: string
            ram:
              type: string
            uptime:
              type: string
